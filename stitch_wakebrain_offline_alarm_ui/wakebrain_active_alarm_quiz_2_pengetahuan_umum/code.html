<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-fixed": "#07006c", "on-secondary-container": "#b0b2ff", "on-error-container": "#ffdad6", "error": "#ffb4ab", "on-primary-container": "#340080", "surface-dim": "#121316", "secondary-fixed-dim": "#c0c1ff", "primary": "#d0bcff", "inverse-primary": "#6d3bd7", "on-secondary": "#1000a9", "inverse-on-surface": "#2f3034", "error-container": "#93000a", "on-primary-fixed": "#23005c", "on-surface-variant": "#cbc3d7", "on-tertiary-container": "#31057e", "tertiary": "#cebdff", "surface-bright": "#38393c", "on-tertiary": "#381385", "surface-container-highest": "#343538", "primary-fixed-dim": "#d0bcff", "secondary": "#c0c1ff", "surface-container-high": "#292a2d", "outline-variant": "#494454", "background": "#121316", "primary-container": "#a078ff", "secondary-fixed": "#e1e0ff", "surface-container-lowest": "#0d0e11", "surface": "#121316", "on-background": "#e3e2e6", "on-surface": "#e3e2e6", "surface-container": "#1f1f23", "outline": "#958ea0", "tertiary-fixed-dim": "#cebdff", "on-primary-fixed-variant": "#5516be", "secondary-container": "#3131c0", "inverse-surface": "#e3e2e6", "tertiary-fixed": "#e8ddff", "primary-fixed": "#e9ddff", "on-tertiary-fixed": "#21005e", "on-tertiary-fixed-variant": "#4f319c", "on-error": "#690005", "surface-tint": "#d0bcff", "surface-variant": "#343538", "surface-container-low": "#1b1b1f", "tertiary-container": "#9b7fed", "on-secondary-fixed-variant": "#2f2ebe", "on-primary": "#3c0091" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "1rem", "margin": "1rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "space-xl": "2rem", "space-md": "1rem", "space-xs": "0.25rem" }, fontFamily: { "label-lg": ["Plus Jakarta Sans"], "title-lg": ["Plus Jakarta Sans"], "display-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"] }, fontSize: { "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "title-lg": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "display-md": ["44px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg-mobile": ["52px", { "lineHeight": "60px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "500" }], "headline-md": ["26px", { "lineHeight": "34px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col flex-1 relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg select-none">
<!-- Top Audio Pulsing Ambient Glow -->
<div class="relative w-full flex flex-col items-center pt-space-sm pb-space-xs overflow-hidden">
<div class="absolute -top-12 w-64 h-32 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Branding & Live Alarm Status Badge -->
<div class="relative z-10 flex items-center justify-between w-full">
<div class="flex items-center gap-space-xs">
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">neurology</span>
</div>
<span class="font-title-md text-title-md text-on-surface tracking-tight">WakeBrain</span>
</div>
<div class="flex items-center gap-space-xs bg-error-container/30 px-3 py-1.5 rounded-full">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-error opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-error"></span>
</span>
<span class="font-label-sm text-label-sm text-error uppercase tracking-wider font-bold">WAKE UP!</span>
</div>
</div>
<!-- Time Readout & Ringing Status -->
<div class="flex flex-col items-center mt-space-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tighter drop-shadow-sm">07:00</h1>
<div class="flex items-center gap-1.5 bg-surface-container-high/80 px-3 py-1 rounded-full mt-0.5">
<span class="material-symbols-outlined text-primary text-[16px] animate-bounce">volume_up</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Alarm masih berdering</span>
</div>
</div>
</div>
<!-- Challenge Tracker / Progress Indicator -->
<div class="flex flex-col items-center w-full mt-space-md mb-space-sm bg-surface-container-low p-space-sm rounded-xl">
<div class="flex items-center gap-space-sm mb-1.5">
<!-- Quiz 1 Completed -->
<div class="flex items-center justify-center w-7 h-7 rounded-full bg-primary-container text-on-primary-container shadow-sm">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<!-- Progress Bar Connector -->
<div class="w-8 h-1 rounded-full bg-primary"></div>
<!-- Quiz 2 Active (Pulsing) -->
<div class="relative flex items-center justify-center w-7 h-7 rounded-full bg-primary text-on-primary">
<span class="absolute w-full h-full rounded-full bg-primary/40 animate-ping"></span>
<span class="font-label-md text-label-md font-bold">2</span>
</div>
</div>
<div class="flex items-center gap-1.5">
<span class="font-label-md text-label-md text-primary font-bold">Tantangan 2 dari 2:</span>
<span class="font-label-md text-label-md text-on-surface-variant">Pengetahuan Umum</span>
</div>
</div>
<!-- Main Trivia Card -->
<div class="w-full bg-surface-container rounded-xl p-space-md flex flex-col items-center shadow-lg relative overflow-hidden">
<!-- Subtle high-focus backdrop motif -->
<div class="absolute -right-8 -top-8 w-28 h-28 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="flex items-center gap-1 px-3 py-1 rounded-full bg-surface-container-highest self-start mb-space-xs">
<span class="material-symbols-outlined text-primary text-[14px]">public</span>
<span class="font-label-sm text-label-sm text-primary tracking-wider uppercase font-semibold">Geografi Dunia</span>
</div>
<div class="w-full py-space-sm text-center">
<h2 class="font-headline-md text-headline-md text-on-surface font-bold leading-snug">
        Apa ibu kota Australia?
      </h2>
</div>
<!-- Answer Options Container (Single-Select Radio Logic) -->
<div class="w-full flex flex-col gap-space-xs mt-space-xs" id="quiz-options">
<!-- Option A -->
<button class="option-btn w-full min-h-[56px] px-space-md py-3 rounded-lg bg-surface-container-high text-on-surface flex items-center justify-between text-left transition-all active:scale-[0.98]" onclick="selectAnswer(this, 'Sydney')" type="button">
<div class="flex items-center gap-space-sm">
<span class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center font-title-md text-title-md text-on-surface-variant font-bold">A</span>
<span class="font-title-md text-title-md font-medium text-on-surface">Sydney</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center"></div>
</button>
<!-- Option B (Default Selected Scenario State) -->
<button class="option-btn selected w-full min-h-[56px] px-space-md py-3 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-between text-left shadow-md transition-all active:scale-[0.98]" onclick="selectAnswer(this, 'Canberra')" type="button">
<div class="flex items-center gap-space-sm">
<span class="w-8 h-8 rounded-full bg-on-primary-container text-primary-container flex items-center justify-center font-title-md text-title-md font-bold">B</span>
<span class="font-title-md text-title-md font-bold text-on-primary-container">Canberra</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full bg-on-primary-container text-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
<!-- Option C -->
<button class="option-btn w-full min-h-[56px] px-space-md py-3 rounded-lg bg-surface-container-high text-on-surface flex items-center justify-between text-left transition-all active:scale-[0.98]" onclick="selectAnswer(this, 'Perth')" type="button">
<div class="flex items-center gap-space-sm">
<span class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center font-title-md text-title-md text-on-surface-variant font-bold">C</span>
<span class="font-title-md text-title-md font-medium text-on-surface">Perth</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center"></div>
</button>
</div>
</div>
<!-- Primary Confirmation Action & Humanized Footnote -->
<div class="w-full flex flex-col items-center mt-space-md gap-space-sm">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-md text-title-md flex items-center justify-center gap-space-xs shadow-lg transition-transform active:scale-[0.98]" id="submit-btn" onclick="verifySolution()" type="button">
<span>Periksa Jawaban</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="flex items-center gap-1.5 px-space-xs text-center">
<span class="material-symbols-outlined text-primary text-[18px]">verified</span>
<p class="font-label-md text-label-md text-on-surface-variant">
        Tinggal 1 jawaban benar lagi untuk mematikan alarm.
      </p>
</div>
</div>
<!-- Interactive Script for Answer Selection and Micro-interaction -->
<script>
    let currentSelectedValue = 'Canberra';

    function selectAnswer(buttonElement, answerText) {
      currentSelectedValue = answerText;
      const allButtons = document.querySelectorAll('.option-btn');
      
      allButtons.forEach(btn => {
        btn.classList.remove('selected', 'bg-primary-container', 'text-on-primary-container', 'shadow-md');
        btn.classList.add('bg-surface-container-high', 'text-on-surface');
        
        const badge = btn.querySelector('span:first-child');
        if (badge) {
          badge.className = 'w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center font-title-md text-title-md text-on-surface-variant font-bold';
        }
        
        const label = btn.querySelector('span:last-child');
        if (label) {
          label.classList.remove('font-bold', 'text-on-primary-container');
          label.classList.add('font-medium', 'text-on-surface');
        }

        const indicator = btn.querySelector('.radio-indicator');
        if (indicator) {
          indicator.className = 'radio-indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center';
          indicator.innerHTML = '';
        }
      });

      // Highlight target selection
      buttonElement.classList.add('selected', 'bg-primary-container', 'text-on-primary-container', 'shadow-md');
      buttonElement.classList.remove('bg-surface-container-high', 'text-on-surface');

      const badge = buttonElement.querySelector('span:first-child');
      if (badge) {
        badge.className = 'w-8 h-8 rounded-full bg-on-primary-container text-primary-container flex items-center justify-center font-title-md text-title-md font-bold';
      }

      const label = buttonElement.querySelector('span:last-child');
      if (label) {
        label.classList.add('font-bold', 'text-on-primary-container');
        label.classList.remove('font-medium', 'text-on-surface');
      }

      const indicator = buttonElement.querySelector('.radio-indicator');
      if (indicator) {
        indicator.className = 'radio-indicator w-6 h-6 rounded-full bg-on-primary-container text-primary-container flex items-center justify-center';
        indicator.innerHTML = '<span class="material-symbols-outlined text-[16px] font-bold">check</span>';
      }
    }

    function verifySolution() {
      const submitBtn = document.getElementById('submit-btn');
      if (currentSelectedValue === 'Canberra') {
        submitBtn.classList.remove('bg-primary', 'text-on-primary');
        submitBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Benar! Mematikan Alarm...</span>';
      } else {
        submitBtn.classList.add('bg-error', 'text-on-error');
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">close</span><span>Coba Lagi!</span>';
        setTimeout(() => {
          submitBtn.classList.remove('bg-error', 'text-on-error');
          submitBtn.classList.add('bg-primary', 'text-on-primary');
          submitBtn.innerHTML = '<span>Periksa Jawaban</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
        }, 1200);
      }
    }
  </script>
</div></main></body></html>
