<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

ol min-h-screen pt-safe pb-safe"><main class="flex flex-col flex-1 relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg">
<div class="flex flex-col items-center justify-center pt-space-sm pb-space-md text-center">
<div class="inline-flex items-center gap-space-xs px-3 py-1 rounded-full bg-error-container text-on-error-container font-label-md text-label-md mb-2 animate-pulse">
<span class="material-symbols-outlined text-sm leading-none" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<span>ALARM BERBUNYI</span>
</div>
<div class="flex items-center justify-center gap-space-xs text-error">
<span class="material-symbols-outlined text-title-lg animate-bounce">alarm</span>
<span class="font-headline-lg text-headline-lg tracking-tight text-on-surface">07:00</span>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mt-0.5">WAKE UP • PAGI KERJA</p>
<div class="w-full max-w-xs mt-space-md bg-surface-container-high rounded-full p-1.5 flex items-center justify-between">
<div class="flex items-center gap-2 pl-2">
<span class="w-2.5 h-2.5 rounded-full bg-primary ring-2 ring-primary/30"></span>
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant ml-1">Tantangan 1 dari 2</span>
</div>
<span class="font-label-sm text-label-sm px-2.5 py-0.5 rounded-full bg-surface-container text-primary font-medium">Matematika</span>
</div>
</div>
<div class="flex flex-col items-center justify-center bg-surface-container-low rounded-2xl p-space-md my-space-xs text-center relative overflow-hidden">
<div class="absolute -right-6 -bottom-6 w-24 h-24 bg-error-container/20 rounded-full blur-xl pointer-events-none"></div>
<div class="absolute -left-6 -top-6 w-24 h-24 bg-primary/10 rounded-full blur-xl pointer-events-none"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Soal Penjumlahan</span>
<div class="font-display-md text-display-md text-on-surface tracking-tight my-1">
      27 + 18 = ?
    </div>
<div class="w-full max-w-xs mt-space-sm">
<div class="w-full h-16 rounded-xl bg-error-container/30 flex items-center justify-center shadow-inner relative transition-transform duration-150" id="input-box">
<span class="font-display-md text-display-md text-error tracking-wider">35</span>
<span class="absolute right-4 text-error material-symbols-outlined text-title-lg">close</span>
</div>
</div>
</div>
<div class="my-space-sm bg-surface-container rounded-xl p-space-md flex items-start gap-space-sm shadow-sm">
<div class="w-9 h-9 rounded-full bg-error-container flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-on-error-container text-title-md" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-error leading-snug">Jawaban salah!</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-0.5">Alarm masih berbunyi. Coba lagi untuk menonaktifkan dering.</span>
</div>
</div>
<div class="grid grid-cols-3 gap-2 my-space-xs select-none">
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">1</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">2</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">3</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">4</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">5</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">6</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">7</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">8</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">9</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">DEL</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">0</button>
<button class="h-14 rounded-xl bg-surface-container text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center active:bg-surface-container-highest active:scale-95 transition-all" type="button">CLR</button>
</div>
<div class="flex flex-col gap-space-xs mt-space-sm">
<button class="w-full h-14 rounded-xl bg-error-container text-on-error-container font-title-md text-title-md flex items-center justify-center gap-space-xs active:opacity-90 active:scale-[0.99] transition-all shadow-md" id="retry-btn" type="button">
<span class="material-symbols-outlined text-title-md">refresh</span>
<span>Coba Lagi</span>
</button>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-1">
      Fokuskan pikiranmu untuk menyelesaikan hitungan.
    </p>
</div>
</div>
<script>
  (function() {
    const inputBox = document.getElementById('input-box');
    const retryBtn = document.getElementById('retry-btn');
    
    // Play quick shake animation on load to indicate the mistake
    if (inputBox) {
      inputBox.style.transform = 'translateX(-6px)';
      setTimeout(() => { inputBox.style.transform = 'translateX(6px)'; }, 70);
      setTimeout(() => { inputBox.style.transform = 'translateX(-4px)'; }, 140);
      setTimeout(() => { inputBox.style.transform = 'translateX(4px)'; }, 210);
      setTimeout(() => { inputBox.style.transform = 'translateX(0)'; }, 280);
    }

    if (retryBtn && inputBox) {
      retryBtn.addEventListener('click', function() {
        const textSpan = inputBox.querySelector('span');
        if (textSpan) {
          textSpan.textContent = '';
          textSpan.classList.remove('text-error');
          textSpan.classList.add('text-on-surface');
        }
        inputBox.classList.remove('bg-error-container/30');
        inputBox.classList.add('bg-surface-container-highest');
        const icon = inputBox.querySelector('.material-symbols-outlined');
        if (icon) icon.remove();
      });
    }
  })();
</script></main></body></html>
